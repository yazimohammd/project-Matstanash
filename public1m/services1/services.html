
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل المؤسسة</title>

    <style>
        :root {
            --primary: #155e75;
            --primary-dark: #164e63;
            --accent: #f59e0b;
            --ink: #172033;
            --muted: #64748b;
            --surface: #ffffff;
            --line: #dbe4ea;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #e0f2fe 0%, #f8fafc 52%, #fef3c7 100%);
            color: var(--ink);
            font-family: "Tahoma", "Segoe UI", sans-serif;
        }

        .home-button {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 10;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 18px;
            border: 1px solid rgba(21, 94, 117, 0.18);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.94);
            color: var(--primary-dark);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.1);
            transition: background 0.2s, color 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        .home-button:hover {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 10px 22px rgba(21, 94, 117, 0.24);
            transform: translateY(-2px);
        }

        .main-f {
            width: min(100%, 540px);
            padding: 38px clamp(22px, 6vw, 56px);
            background: var(--surface);
            border: 1px solid rgba(21, 94, 117, 0.12);
            border-radius: 20px;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.14);
        }

        h2 {
            margin: 0 0 8px;
            color: var(--primary-dark);
            font-size: clamp(24px, 4vw, 30px);
            text-align: center;
        }

        h2::after {
            content: "";
            display: block;
            width: 48px;
            height: 4px;
            margin: 14px auto 28px;
            border-radius: 4px;
            background: var(--accent);
        }

        .main-f div {
            width: 100%;
            margin-bottom: 18px;
        }

        .main-f i {
            display: block;
            margin-bottom: 8px;
            color: var(--ink);
            font-size: 14px;
            font-style: normal;
            font-weight: 700;
        }

        .main-f div input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            outline: none;
            background: #f8fafc;
            color: var(--ink);
            font: inherit;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .main-f div input:focus {
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 4px rgba(21, 94, 117, 0.12);
        }

        #oklogin {
            min-height: 24px;
            margin-top: 16px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }

        #oklogin.success { color: #15803d; }
        #oklogin.error { color: #b91c1c; }

        .main-f div:last-child {
            margin-top: 26px;
            margin-bottom: 0;
        }

        button {
            width: 100%;
            min-height: 50px;
            border: 0;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            background: var(--primary-dark);
            box-shadow: 0 8px 18px rgba(21, 94, 117, 0.24);
            transform: translateY(-2px);
        }

        button:active { transform: translateY(0); }

        @media (max-width: 480px) {
            body { padding: 14px; }
            .main-f { padding: 30px 20px; border-radius: 16px; }
            .home-button { top: 14px; right: 14px; min-height: 40px; padding: 0 14px; }
        }
    </style>
</head>
<body>
    <a class="home-button" href="./">الصفحة الرئيسية</a>

    <div class="main-f">
        <h2>تسجيل المؤسسة</h2>
        <div>
            <i>إسم المستخدم للمؤسسة</i> 
            <input type="text" id="userf" required>
        </div>
        <div>
            <i>إسم المؤسسة</i>
            <input type="text" id="namef" required>
        </div>
        <div>
            <i>البريد الإلكتروني</i>
            <input type="email" id="emailf" required>
        </div>
        <div>
            <i>كلمة المرور</i>
            <input type="password" id="passwordf" required>
        </div>
        <div>
            <button type="button" id="register-button" onclick="register1form()">تسجيل</button>
            
        </div>
        
    </div>
    <div id="oklogin"></div>


    <!-- ------------------ -->
    <!--  -->
    <!-- ------------------ -->
    <script>

        function register1form(){
            const userf     = document.getElementById('userf');
            const namef     = document.getElementById('namef');
            const emailf    = document.getElementById('emailf');
            const passwordf = document.getElementById('passwordf');
            const message = document.getElementById('oklogin');
            const button = document.getElementById('register-button');

            message.className = '';
            if (userf.value.trim() === '' || namef.value.trim() === '' ||
                emailf.value.trim() === '' || passwordf.value.trim() === '') {
                message.textContent = 'يرجى تعبئة جميع الحقول';
                message.className = 'error';
                return;
            }

            if (!emailf.validity.valid) {
                message.textContent = 'يرجى إدخال بريد إلكتروني صحيح';
                message.className = 'error';
                emailf.focus();
                return;
            }
            
            const sdata = new URLSearchParams();
            sdata.append('NUSERNAME', userf.value.trim());
            sdata.append('NNAME', namef.value.trim());
            sdata.append('NEMAIL', emailf.value.trim());
            sdata.append('NPASSWORD', passwordf.value);
            sdata.append('NEWACCONNT', 'true');

            button.disabled = true;
            button.textContent = 'جارٍ التسجيل...';
            message.textContent = '';

            fetch("dataf.php", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: sdata
                })
                .then(async res => {
                    const data = await res.json();
                    if (!res.ok) {
                        throw new Error(data.message || 'Registration failed');
                    }
                    return data;
                })
                .then(data => {
                    message.textContent = data.message || (data.success ? 'تم التسجيل بنجاح' : 'فشل التسجيل');
                    message.className = data.success ? 'success' : 'error';
                    if (data.success) {
                        const homeButton = document.createElement('button');
                        homeButton.type = 'button';
                        homeButton.textContent = 'العودة إلى الصفحة الرئيسية';
                        homeButton.onclick = () => {
                            window.location.href = './';
                        };
                        message.appendChild(document.createElement('br'));
                        message.appendChild(homeButton);
                        userf.value = '';
                        namef.value = '';
                        emailf.value = '';
                        passwordf.value = '';
                    }
                })
                .catch(error => {
                    message.textContent = error.message || 'تعذر الاتصال بالخادم';
                    message.className = 'error';
                })
                .finally(() => {
                    button.disabled = false;
                    button.textContent = 'تسجيل';
                });
        }
    </script>
</body>
</html>
