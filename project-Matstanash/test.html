<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختر موقعك</title>
    <!-- استدعاء خط Tajawal ليتطابق مع خطوط الصورة الاحترافية -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة الخريطة Leaflet وتخصيصها لتطابق النمط البصري -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
        /* إخفاء عناصر التحكم الافتراضية للخريطة لتصميم عناصر مخصصة تماماً كالصورة */
        .leaflet-control-zoom {
            display: none !important;
        }
        .leaflet-attribution-flag {
            display: none !important;
        }
        /* تأثير النبض للعلامة المحددة في ورقلة */
        .pulse-ring {
            border: 3px solid #00bfa5;
            -webkit-border-radius: 30px;
            height: 48px;
            width: 48px;
            position: absolute;
            left: -14px;
            top: -14px;
            animation: pulsate 1.8s ease-out;
            animation-iteration-count: infinite; 
            opacity: 0.0;
        }
        @keyframes pulsate {
            0% {-webkit-transform: scale(0.1, 0.1); opacity: 0.0;}
            50% {opacity: 1.0;}
            100% {-webkit-transform: scale(1.2, 1.2); opacity: 0.0;}
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 sm:p-6 selection:bg-teal-500 selection:text-white">

    <!-- الحاوية الرئيسية للهاتف المحمول تحاكي أبعاد الصورة بدقة -->
    <div class="w-full max-w-[390px] bg-white rounded-[40px] shadow-[0_25px_60px_-15px_rgba(0,0,0,0.15)] p-6 flex flex-col gap-5 border border-gray-100 relative overflow-hidden">
        
        <!-- الترويسة (Header) -->
        <div class="text-center mt-2">
            <h2 class="text-[26px] font-extrabold text-[#d1d5db] tracking-wide leading-none">اختر موقعك</h2>
            <p class="text-xs text-[#d1d5db] font-medium mt-2 leading-relaxed">ساعدنا في تحديد موقعك لتقديم أفضل الخدمات</p>
        </div>

        <!-- حقل البحث المستدير المتطابق مع الصورة -->
        <div class="relative">
            <input id="locationInput" type="text" 
                   class="w-full py-4 pr-6 pl-14 bg-white border border-gray-100 shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-full outline-none text-right text-gray-700 placeholder-gray-300 font-medium transition-all focus:shadow-[0_8px_30px_rgba(0,191,165,0.1)] focus:border-teal-200" 
                   placeholder="اكتب اسم ولايتك هنا..."
                   onkeypress="handleSearch(event)">
            
            <!-- الأيقونات التفاعلية المزدوجة على اليسار -->
            <div class="absolute left-5 inset-y-0 flex items-center gap-2 text-sky-400">
                <i class="fas fa-search cursor-pointer hover:text-sky-500 transition" onclick="triggerSearch()"></i>
                <i class="fas fa-map-marker-alt"></i>
            </div>
        </div>

        <!-- إطار الخريطة السميك ذو اللون الرمادي المتطابق تماماً مع الصورة -->
        <div class="relative w-full aspect-[349/320] bg-gray-300 rounded-[30px] border-[12px] border-gray-400 overflow-hidden shadow-inner">
            <!-- حاوية الخريطة الحقيقية -->
            <div id="map" class="w-full h-full z-0"></div>
            
            <!-- أزرار التحكم في التكبير المخصصة باللون الرمادي الداكن المطفأ (أسفل اليسار) -->
            <div class="absolute bottom-4 right-4 flex flex-col gap-1.5 z-10">
                <button onclick="map.zoomIn()" class="bg-[#4b5563]/90 text-white w-9 h-9 rounded-lg shadow-lg hover:bg-[#374151] transition flex items-center justify-center font-bold text-xl select-none">+</button>
                <button onclick="map.zoomOut()" class="bg-[#4b5563]/90 text-white w-9 h-9 rounded-lg shadow-lg hover:bg-[#374151] transition flex items-center justify-center font-bold text-xl select-none">-</button>
            </div>

            <!-- زر تحديد الموقع الأزرق المخصص (أسفل اليمين) -->
            <button onclick="resetToDefaultLocation()" class="absolute bottom-4 left-4 bg-[#3b82f6] text-white w-10 h-10 rounded-full shadow-lg hover:bg-blue-600 transition flex items-center justify-center z-10 hover:scale-105 active:scale-95">
                <i class="fas fa-crosshairs text-lg"></i>
            </button>
        </div>

        <!-- بطاقة الحالة الذكية بلونها الفيروزي المميز والأيقونة البنفسجية -->
        <div class="bg-[#00bfa5] rounded-[24px] p-4 flex gap-4 items-center text-white shadow-lg shadow-teal-500/10 hover:shadow-teal-500/20 transition-all duration-300">
            <!-- أيقونة الموقع داخل المربع البنفسجي الغامق -->
            <div class="bg-[#1e00a3] p-3.5 rounded-[18px] flex items-center justify-center shadow-md">
                <i class="fas fa-map-marker-alt text-lg text-teal-400"></i>
            </div>
            <div class="flex-1 text-right">
                <p class="font-bold text-sm leading-snug">تم تحديد موقعك الحالي: ولاية <span id="currentStateText">ورقلة</span></p>
                <p class="text-[11px] opacity-90 mt-1 leading-normal">يمكنك تغيير الموقع يدوياً عبر البحث أو اختيار ولاية من الخريطة.</p>
            </div>
        </div>

        <!-- زر المتابعة البرتقالي العريض المتطابق مع الصورة -->
        <button onclick="confirmLocation()" class="w-full bg-[#ffb300] hover:bg-[#ffa000] text-gray-900 font-extrabold py-4 rounded-full shadow-lg shadow-amber-500/20 hover:shadow-amber-500/30 transition-all duration-300 flex items-center justify-center gap-2 text-[17px] active:scale-98">
            تأكيد المتابعة <i class="fas fa-arrow-left text-sm mr-1"></i>
        </button>

    </div>

    <!-- نافذة إشعار منبثقة بديلة لـ alert() -->
    <div id="customModal" class="fixed inset-0 bg-black/50 z-[9999] flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl max-w-xs w-full p-6 text-center shadow-2xl scale-95 transition-transform duration-300" id="modalContainer">
            <div class="w-16 h-16 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fas fa-check-circle"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-800 mb-2" id="modalTitle">تم حفظ الموقع</h3>
            <p class="text-sm text-gray-500 mb-6" id="modalBody">تم اختيار موقعك بنجاح ومزامنته مع النظام.</p>
            <button onclick="closeModal()" class="w-full bg-[#00bfa5] text-white font-bold py-3 rounded-full hover:bg-teal-600 transition shadow-lg shadow-teal-500/15">
                حسناً
            </button>
        </div>
    </div>

    <script>
        let map;
        let currentMarker;
        let currentLatLng = [31.9493, 5.3250]; // ورقلة كقيمة افتراضية
        let currentCityName = "ورقلة";

        // تهيئة الخريطة عند تحميل الصفحة
        window.onload = function() {
            initMap();
        };

        function initMap() {
            // إعداد خريطة هادئة وجميلة تحاكي المظهر المتناسق للصورة (CartoDB Positron)
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView(currentLatLng, 12);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(map);

            updateMarker(currentLatLng, currentCityName);

            // تفعيل ميزة النقر على الخريطة لتغيير الموقع تلقائياً
            map.on('click', async function(e) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                currentLatLng = [lat, lng];
                
                // محاولة جلب اسم المكان من الإحداثيات (Reverse Geocoding) باستخدام API مجاني
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ar`);
                    const data = await response.json();
                    if (data && data.address) {
                        const city = data.address.state || data.address.city || data.address.town || "موقع مخصص";
                        currentCityName = city.replace("ولاية ", "");
                    } else {
                        currentCityName = "موقع مخصص";
                    }
                } catch (error) {
                    currentCityName = "موقع محدد";
                }

                updateMarker(currentLatLng, currentCityName);
                updateUIForLocation(currentCityName);
            });
        }

        // تحديث العلامة المخصصة على الخريطة
        function updateMarker(latlng, label) {
            if (currentMarker) {
                map.removeLayer(currentMarker);
            }

            // أيقونة مخصصة رائعة تتطابق مع لون التصميم الفيروزي وعلامة ورقلة بالصورة
            const customIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `
                    <div class="relative flex flex-col items-center">
                        <div class="bg-[#1e293b] text-white text-[10px] font-bold px-2.5 py-1 rounded-full shadow-md whitespace-nowrap mb-1 border border-teal-400">
                            ${label}
                        </div>
                        <div class="relative flex items-center justify-center">
                            <div class="pulse-ring"></div>
                            <div class="w-5 h-5 bg-[#00bfa5] rounded-full border-2 border-white shadow-lg flex items-center justify-center">
                                <div class="w-2 h-2 bg-white rounded-full"></div>
                            </div>
                        </div>
                    </div>
                `,
                iconSize: [80, 50],
                iconAnchor: [40, 45]
            });

            currentMarker = L.marker(latlng, { icon: customIcon }).addTo(map);
            map.setView(latlng, map.getZoom());
        }

        // تحديث نصوص الواجهة
        function updateUIForLocation(name) {
            document.getElementById('currentStateText').innerText = name;
            document.getElementById('locationInput').value = name;
        }

        // إعادة التعيين للموقع الافتراضي (ورقلة) عند الضغط على زر الكروسهير
        function resetToDefaultLocation() {
            currentLatLng = [31.9493, 5.3250];
            currentCityName = "ورقلة";
            map.setView(currentLatLng, 12);
            updateMarker(currentLatLng, currentCityName);
            updateUIForLocation(currentCityName);
        }

        // البحث عن مكان وتحريك الخريطة إليه (Geocoding)
        async function triggerSearch() {
            const query = document.getElementById('locationInput').value.trim();
            if (!query) return;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', الجزائر')}&accept-language=ar&limit=1`);
                const data = await response.json();
                
                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    currentLatLng = [lat, lon];
                    
                    // استخلاص الاسم بطريقة أنظف
                    let name = data[0].display_name.split(',')[0];
                    currentCityName = name.replace("ولاية ", "");
                    
                    updateMarker(currentLatLng, currentCityName);
                    updateUIForLocation(currentCityName);
                    map.setView(currentLatLng, 11);
                } else {
                    showCustomModal("تنبيه", "عذراً، لم نتمكن من العثور على هذا الموقع بالجزائر. يرجى التحقق من الاسم المدخل.");
                }
            } catch (error) {
                showCustomModal("خطأ", "حدث عطل أثناء الاتصال بخدمة البحث.");
            }
        }

        function handleSearch(e) {
            if (e.key === 'Enter') {
                triggerSearch();
            }
        }

        // نافذة تأكيد مخصصة ومصقولة عند النقر على "تأكيد المتابعة"
        function confirmLocation() {
            showCustomModal("تم تأكيد الموقع", `لقد قمت باختيار ولاية <strong>${currentCityName}</strong> كموقعك الحالي للخدمات بنجاح.`);
        }

        function showCustomModal(title, text) {
            const modal = document.getElementById('customModal');
            const container = document.getElementById('modalContainer');
            document.getElementById('modalTitle').innerHTML = title;
            document.getElementById('modalBody').innerHTML = text;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                container.classList.remove('scale-95');
                container.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            const container = document.getElementById('modalContainer');
            modal.classList.add('opacity-0');
            container.classList.remove('scale-100');
            container.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }
    </script>
</body>
</html>
