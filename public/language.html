<!DOCTYPE html>
<!-- تم ضبط الصفحة على LTR لأن العنوان "Select Language" بالإنجليزية -->
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Language</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="mobile-container">
        <header class="header">
            <img src="matstanashimage.png" alt="شعار ماتستناش" class="logo-image">
        </header>

        <main class="main-content">
            <div class="language-card">
                <h2>Select Language</h2>
                <ul class="language-list">
                    <li><a href="login.html"><span>Arabic</span> <i class="fas fa-arrow-right"></i></a></li>
                    <li><a href="login.html" class="active"><span>English</span> <i class="fas fa-arrow-right"></i></a></li>
                    <li><a href="login.html"><span>Français</span> <i class="fas fa-arrow-right"></i></a></li>
                </ul>
            </div>

            <div class="settings-footer">
                <div class="theme-toggle">
                    <i class="fas fa-sun"></i>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider round"></span>
                    </label>
                    <i class="fas fa-moon"></i>
                </div>
                <p class="footer-text">PRECISION • URGENCY • RELIABILITY</p>
            </div>
        </main>
    </div>

</body>
</html>
