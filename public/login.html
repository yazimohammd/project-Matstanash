<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="mobile-container">
        <header class="header">
            <img src="matstanashimage.png" alt="شعار ماتستناش" class="logo-image">
        </header>

        <main class="main-content">
            <div class="login-card">
                <h2>تسجيل الدخول</h2>
                <p class="subtitle">مرحبا بك مجددا في ماتستناش</p>

                <form id="login-form" novalidate>
                    <div class="input-group">
                        <i class="fas fa-user icon"></i>
                        <input type="text" id="username" placeholder="اسم المستخدم / البريد الإلكتروني" required>
                        <div class="error-message"></div>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock icon"></i>
                        <input type="password" id="password" placeholder="كلمة المرور" required>
                        <div class="error-message"></div>
                    </div>
                    <a href="#" class="forgot-password">نسيت كلمة المرور؟</a>

                    <button type="submit" class="btn-login">
                        تسجيل الدخول <i class="fas fa-arrow-left"></i>
                    </button>
                </form>

                <div class="separator">أو قم</div>

                <div class="social-login">
                    <a href="#" class="social-btn facebook"><i class="fab fa-facebook-f"></i> Facebook</a>
                    <a href="#" class="social-btn google"><i class="fab fa-google"></i> Google</a>
                </div>

                <p class="signup-link">
                    ليس لديك حساب؟ <a href="#">إنشاء حساب جديد</a>
                </p>
            </div>

            <!-- بطاقات المعلومات الإضافية -->
            <div class="info-cards-container">
                <div class="info-card">
                    <span class="info-card-icon shield">0</span>
                    <p>أمان وحماية</p>
                    <strong>مضمون</strong>
                </div>
                <div class="info-card active">
                    <span class="info-card-icon bolt">4</span>
                    <p>بسرعة في التنفيذ</p>
                    <strong>فوري</strong>
                </div>
            </div>

        </main>

        <!-- شريط التنقل السفلي -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active"><i class="fas fa-home"></i><span>الرئيسية</span></a>
            <a href="#" class="nav-item"><i class="fas fa-receipt"></i><span>حجوزاتي</span></a>
            <a href="#" class="nav-item"><i class="fas fa-bell"></i><span>التنبيهات</span></a>
            <a href="#" class="nav-item"><i class="fas fa-cog"></i><span>الإعدادات</span></a>
        </nav>
    </div>

    <!-- ملف الجافاسكربت -->
    <script src="validation.js"></script>
</body>
</html>
