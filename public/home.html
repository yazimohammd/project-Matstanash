<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="mobile-container">
        <!-- رأس الصفحة الخاص بالشاشة الرئيسية -->
        <header class="home-header">
            <div class="user-greeting">
                <p>مرحباً بعودتك</p>
                <h3>أحمد</h3>
            </div>
            <div class="user-avatar">
                <!-- يمكنك وضع صورة المستخدم هنا -->
                <img src="https://via.placeholder.com/50" alt="صورة المستخدم">
            </div>
        </header>

        <main class="main-content">
            <!-- شريط البحث -->
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="ابحث عن مؤسسة...">
            </div>

            <!-- أزرار الفلترة -->
            <div class="filter-tabs">
                <button class="filter-btn active">الكل</button>
                <button class="filter-btn">بنوك</button>
                <button class="filter-btn">مستشفيات</button>
                <button class="filter-btn">اتصالات</button>
                <button class="filter-btn">حكومية</button>
            </div>

            <!-- قائمة المؤسسات -->
            <div class="institution-list">
                <!-- بطاقة مؤسسة - مثال 1 -->
                <a href="#" class="institution-card">
                    <div class="institution-logo">
                        <img src="https://via.placeholder.com/50/0D0B5B/FFFFFF?text=CIB" alt="CIB Logo">
                    </div>
                    <div class="institution-details">
                        <h3>البنك التجاري الدولي CIB</h3>
                        <p>بنك • يبعد 2 كم</p>
                    </div>
                    <div class="institution-status open">
                        مفتوح
                    </div>
                </a>

                <!-- بطاقة مؤسسة - مثال 2 -->
                <a href="#" class="institution-card">
                    <div class="institution-logo">
                        <img src="https://via.placeholder.com/50/E60000/FFFFFF?text=V" alt="Vodafone Logo">
                    </div>
                    <div class="institution-details">
                        <h3>فودافون مصر</h3>
                        <p>اتصالات • يبعد 5 كم</p>
                    </div>
                    <div class="institution-status closed">
                        مغلق
                    </div>
                </a>
                <!-- يمكنك إضافة المزيد من البطاقات هنا -->
            </div>
        </main>

        <!-- شريط التنقل السفلي -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active"><i class="fas fa-home"></i><span>الرئيسية</span></a>
            <a href="#" class="nav-item"><i class="fas fa-receipt"></i><span>حجوزاتي</span></a>
            <a href="#" class="nav-item"><i class="fas fa-bell"></i><span>التنبيهات</span></a>
            <a href="#" class="nav-item"><i class="fas fa-cog"></i><span>الإعدادات</span></a>
        </nav>
    </div>

</body>
</html>
