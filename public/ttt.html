<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<style>
    .logo-container {
        background-color: #0000a0; /* اللون الأزرق الغامق */
        display: inline-flex;
        align-items: center;
        padding: 20px;
        border-radius: 10px;
        color: white;
        font-family: Arial, sans-serif;
    }

    .logo-text {
        font-size: 48px;
        font-weight: bold;
        margin-left: 15px;
    }

    .logo-icons {
        font-size: 50px;
        color: #ffcc00; /* اللون الأصفر للساعة */
        position: relative;
    }

    /* تنسيق الجرس */
    .bell {
        color: white;
        position: absolute;
        bottom: -5px;
        left: 5px;
        font-size: 30px;
    }
</style>
</head>
<body>

<div class="logo-container">
    <div class="logo-icons">
        <span>🕒</span>
        <span class="bell">🔔</span>
    </div>
    <div class="logo-text">ماتستناش</div>
</div>

</body>
</html>
